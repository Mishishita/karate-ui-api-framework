name: QA Automation CI

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      - name: Register User UI
        run: mvn -Dtest=RegistroUsuarioPWTest test

      - name: Run API E2E
        run: mvn -Dtest=TestRunner test

